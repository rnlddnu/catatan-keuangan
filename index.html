const vir=()=>AS.filter(x=>x.akun).map(x=>({jenis:x.nominal>0?'keluar':'masuk',tanggal:x.tanggal,nominal:Math.abs(x.nominal),kategori:'Aset',akun:x.akun,catatan:'Aset · '+x.aset+(x.catatan?' · '+x.catatan:''),row:0,v:1}));
async function seed(){const rows=[mk('meta',{label:'seed'})];AKUN.forEach(a=>rows.push(mk('akun',{label:a})));KEL.forEach(k=>rows.push(mk('kategori',{label:k,extra:{j:'keluar'}})));MAS.forEach(k=>rows.push(mk('kategori',{label:k,extra:{j:'masuk'}})));return SB.from('records').insert(rows)}
async function load(){$('#v').innerHTML='<div class="emp">Memuat data…</div>';
try{let R=await ambil();
if(!R.some(r=>r.kind==='meta')){const e=(await seed()).error;if(e)toast('Pengaturan belum bisa disimpan: '+e.message,1);else R=await ambil()}
if(!R.some(r=>r.kind==='meta'&&r.label==='seed_aset')&&!sAS){sAS=1;const e2=(await SB.from('records').insert([mk('meta',{label:'seed_aset'}),...ASET.map(a=>mk('jenis_aset',{label:a}))])).error;sAS=0;if(!e2)R=await ambil()}
const hasAS=R.some(r=>r.kind==='meta'&&r.label==='seed_aset');
const T=[];TF=[];AS=[];HU=[];PI=[];SA={};SAS={};PF={};B={};BB={};PN=null;NM={akun:[],keluar:[],masuk:[],aset:[]};const sdAS=new Set();
R.forEach(r=>{const n=Number(r.nominal),e=r.extra||{},k=r.kind,b={row:r.id,id:r.id,tanggal:r.tanggal,catatan:r.catatan||''};
if(k==='transaksi')T.push({...b,jenis:e.jenis||'keluar',nominal:n,kategori:r.label||'',akun:r.akun||'',foto:e.foto||''});
else if(k==='budget'){const bl=e.bln||'';(BB[bl]=BB[bl]||{})[r.label]=n}else if(k==='pin')PN={id:r.id,salt:e.salt,h:e.h};else if(k==='saldo_awal')SA[r.akun]=n;else if(k==='saldo_aset')SAS[r.label]=n;else if(k==='profil')PF=e;
else if(k==='transfer')TF.push({...b,dari:r.akun,ke:r.label,nominal:n});
else if(k==='aset')AS.push({...b,aset:r.label,akun:r.akun||'',nominal:n*(e.s||1)});
else if(k==='hutang')HU.push({...b,pihak:r.label,akun:r.akun||'',nominal:n*(e.s||1)});
else if(k==='piutang')PI.push({...b,pihak:r.label,akun:r.akun||'',nominal:n*(e.s||1)});
else if(k==='jenis_aset'){if(!sdAS.has(r.label)){sdAS.add(r.label);NM.aset.push({id:r.id,l:r.label})}}
else if(k==='akun')NM.akun.push({id:r.id,l:r.label});
else if(k==='kategori')NM[e.j==='masuk'?'masuk':'keluar'].push({id:r.id,l:r.label})});
if(NM.akun.length)AKUN.splice(0,AKUN.length,...NM.akun.map(x=>x.l));
if(NM.keluar.length)KEL.splice(0,KEL.length,...NM.keluar.map(x=>x.l));
if(NM.masuk.length)MAS.splice(0,MAS.length,...NM.masuk.map(x=>x.l));
if(hasAS)ASET.splice(0,ASET.length,...NM.aset.map(x=>x.l));
if(PN){try{localStorage.setItem('pinc',JSON.stringify({u:U,salt:PN.salt,h:PN.h}))}catch(e){}}
D=T.concat(vir());render()}
catch(e){$('#v').innerHTML=`<div class="emp gl">Gagal memuat: ${esc(e.message||e)}<br><br><button class="btn" onclick="load()">Coba lagi</button></div>`}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){hid=Date.now();return}
if(!U||LK)return;if(pk){pk=0;hid=0;return}
if(lockOn()&&hid&&Date.now()-hid>30000){kunci();return}
if(!busy&&!$('#sh').classList.contains('on'))load()});
const mk=(kind,x)=>({kind,tanggal:iso(new Date()),nominal:0,...x});
async function kirim(fn,btn,msg){if(busy)return;busy=true;const e=$(btn),lb=e.textContent;e.disabled=true;e.textContent='Menyimpan…';
try{const r=await fn();if(r&&r.error)throw r.error}catch(x){busy=false;e.disabled=false;e.textContent=lb;return toast(x.message||'Gagal menyimpan',1)}
busy=false;closeSheet();toast(msg);load()}
const tulis=(kind,x)=>SB.from('records').insert(mk(kind,x));
async function ganti(kind,arr){const d=await SB.from('records').delete().eq('kind',kind);if(d.error)return d;return arr.length?SB.from('records').insert(arr.map(x=>mk(kind,x))):{}}
let dtm=0;async function hapus(row,b){if(!b.dataset.s){b.dataset.s=1;b.textContent='Tap lagi';setTimeout(()=>{delete b.dataset.s;b.textContent='🗑'},3000);return}
if(busy)return;busy=true;const{error}=await SB.from('records').delete().eq('id',row);busy=false;if(error)return toast(error.message,1);closeSheet();toast('Entri dihapus');load()}
/* ---------- Form transaksi ---------- */
const cats=()=>{const b=[...(jn==='keluar'?KEL:MAS)],o=ed!==null?D[ed]:null;if(o&&o.kategori&&o.jenis===jn&&!b.includes(o.kategori))b.push(o.kategori);return b.filter(k=>k.toLowerCase()!=='aset')};
function openSheet(i){const o=i===undefined?null:D[i];if(o&&o.v)return toast('Entri aset: ubah atau hapus lewat menu Aset',1);ed=o?i:null;jn=o?o.jenis:'keluar';FT={blob:null,prev:'',path:o?o.foto||'':'',url:'',hapus:false};drawSheet(o);muatFoto();$('#bg').style.display='block';requestAnimationFrame(()=>$('#sh').classList.add('on'))}
function closeSheet(){$('#sh').classList.remove('on');$('#bg').style.display='none'}
function drawSheet(o){const v=o||{nominal:'',kategori:'',akun:'',catatan:'',tanggal:iso(new Date())},lk=ed!==null?'disabled':'';
$('#sh').innerHTML=`<div class="seg"><button class="k${jn==='keluar'?' on':''}" ${lk} onclick="jn='keluar';drawSheet(snap())">Pengeluaran</button><button class="m${jn==='masuk'?' on':''}" ${lk} onclick="jn='masuk';drawSheet(snap())">Pemasukan</button></div>
<input id="nom" class="big" inputmode="numeric" placeholder="Rp 0" value="${v.nominal?rp(v.nominal):''}" oninput="fmt(this)">
<div class="row"><div><label>Kategori *</label><select id="kat" onchange="cw()"><option value="">Pilih</option>${opts(cats(),v.kategori)}</select></div><div><label>Akun *</label><select id="akn"><option value="">Pilih</option>${opts(AKUN,v.akun)}</select></div></div>
<div class="row"><div><label>Tanggal *</label><input id="tgl" type="date" value="${v.tanggal}"></div><div><label id="cl">Catatan (opsional)</label><input id="cat" maxlength="120" value="${esc(v.catatan)}"></div></div>
<div><label>Foto bukti (opsional)</label><div id="fb"></div></div><input type="file" id="fk" accept="image/*" capture="environment" hidden onchange="pilihFoto(this)"><input type="file" id="fg" accept="image/*" hidden onchange="pilihFoto(this)"><button class="btn" id="sv" onclick="save()">${ed===null?'Simpan transaksi':'Simpan perubahan'}</button>${ed!==null?'<button class="btn d" id="dl" onclick="del()">Hapus transaksi</button>':''}`;cw();fotoUI();if(ed===null)setTimeout(()=>$('#nom').focus(),300)}
function cw(){const w=$('#kat').value.trim().toLowerCase()==='lainnya';$('#cl').textContent=w?'Catatan (wajib)':'Catatan (opsional)'}
const snap=()=>({nominal:parseInt(($('#nom').value||'').replace(/\D/g,''))||'',kategori:'',akun:$('#akn').value,catatan:$('#cat').value,tanggal:$('#tgl').value});
function fmt(e){const n=parseInt(e.value.replace(/\D/g,''));e.value=n?rp(n):''}
async function save(){if(busy)return;const n=num('#nom'),kat=$('#kat').value,cat=$('#cat').value.trim();
if(!(n>0))return toast('Isi nominal lebih dari 0',1);if(!kat)return toast('Pilih kategori',1);if(!$('#akn').value)return toast('Pilih akun',1);if(!$('#tgl').value)return toast('Pilih tanggal',1);
if(kat.toLowerCase()==='lainnya'&&!cat){$('#cat').focus();return toast('Catatan wajib diisi jika kategori Lainnya',1)}
const tg=$('#tgl').value,ak=$('#akn').value,lama=FT.path,bl=FT.blob,hp=FT.hapus,jj=jn,idRow=ed!==null?D[ed].id:null;
kirim(async()=>{let foto=hp?'':lama;
if(bl){const pt=U+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg',u=await SB.storage.from('bukti').upload(pt,bl,{contentType:'image/jpeg'});if(u.error)return{error:{message:'Foto gagal diunggah: '+u.error.message}};foto=pt}
const rec=mk('transaksi',{tanggal:tg,nominal:n,akun:ak,label:kat,catatan:cat,extra:foto?{jenis:jj,foto}:{jenis:jj}});
const r=idRow===null?await SB.from('records').insert(rec):await SB.from('records').update(rec).eq('id',idRow);
if(r.error){if(bl&&foto)SB.storage.from('bukti').remove([foto]);return r}
if(lama&&lama!==foto)SB.storage.from('bukti').remove([lama]);return r},'#sv','Transaksi tersimpan')}
function del(){const b=$('#dl');if(!b.dataset.s){b.dataset.s=1;b.textContent='Tap lagi untuk menghapus permanen';dtm=setTimeout(()=>{delete b.dataset.s;b.textContent='Hapus transaksi'},4000);return}
clearTimeout(dtm);const id=D[ed].id,fo=D[ed].foto;kirim(async()=>{const r=await SB.from('records').delete().eq('id',id);if(!r.error&&fo)SB.storage.from('bukti').remove([fo]);return r},'#dl','Transaksi dihapus')}
/* ---------- Anggaran ---------- */
const arow=(k,v)=>`<div class="row ar" data-k="${esc(k)}" style="align-items:center"><label style="flex:1.2;margin:0;color:var(--tx)">${esc(k)}</label><input class="ab" inputmode="numeric" placeholder="Rp 0" value="${v?rp(v):''}" oninput="fmt(this);totAr()"><button class="xb" style="flex:none" onclick="this.closest('.ar').remove();totAr()">🗑</button></div>`;
const gb=k=>BB[k]||BB['']||{},nmBln=k=>{const[y,m]=k.split('-').map(Number);return BLN[m-1]+' '+y},
incP=k=>{const[a,b]=perBulan(k),A=iso(a),E=iso(b);return D.filter(x=>x.jenis==='masuk'&&!x.v&&inR(x,A,E)).reduce((s,x)=>s+x.nominal,0)};
function batas(k){const v=incP(k);if(v>0)return{v,est:0,k};let[y,m]=k.split('-').map(Number);for(let i=0;i<12;i++){m--;if(m<1){m=12;y--}const kk=y+'-'+String(m).padStart(2,'0'),w=incP(kk);if(w>0)return{v:w,est:1,k:kk}}return{v:0,est:1,k:''}}
const batasTxt=k=>{const b=batas(k);return !b.v?'Belum ada pemasukan tercatat, jadi anggaran belum bisa disusun':b.est?`Batas anggaran ${rp(b.v)} (perkiraan dari pemasukan ${nmBln(b.k)})`:`Batas anggaran = pemasukan periode ini ${rp(b.v)}`};
const ringkasAng=(k,tb)=>{const b=batas(k);return`<div class="hero" style="margin:0 0 10px"><small>Total anggaran ${nmBln(k)}</small><b>${rp(tb)}</b><small>${b.v?`Pemasukan ${rp(b.v)}${b.est?' (perkiraan)':''} · belum dianggarkan ${rp(b.v-tb)}`:'Belum ada pemasukan tercatat'}</small></div>`};
function totAr(){const t=[...document.querySelectorAll('.ar .ab')].reduce((s,e)=>s+(parseInt((e.value||'').replace(/\D/g,''),10)||0),0),b=batas(BL).v,e=$('#at');if(e){e.textContent='Total anggaran '+rp(t)+' dari batas '+rp(b);e.style.color=t>b?'var(--out)':'var(--mu)'}}
function openBudget(bln){bln=bln||pm;BL=bln;const Bk=gb(bln),ks=Object.keys(Bk).filter(k=>Bk[k]>0);
shw(ttl('Anggaran '+nmBln(bln))+`<small style="color:var(--mu)">${batasTxt(bln)}. Total anggaran tidak boleh melebihi batas ini. Ketuk 🗑 untuk menghapus.</small><div id="al" style="display:grid;gap:8px">${ks.map(k=>arow(k,Bk[k])).join('')}</div><div class="row" style="align-items:end"><div><label>Tambah anggaran</label><input id="an" list="anl" placeholder="Pilih / ketik kategori baru" autocomplete="off" maxlength="40"><datalist id="anl">${KEL.filter(k=>k!=='Aset'&&!(Bk[k]>0)).map(k=>`<option value="${esc(k)}">`).join('')}</datalist></div><div><label>Batas</label><input id="anv" inputmode="numeric" placeholder="Rp 0" oninput="fmt(this)"></div></div><div id="at" style="font-size:13px"></div><button class="btn s" onclick="tambahAr()">+ Tambah ke daftar</button><button class="btn" id="sa" onclick="simpanAnggaran()">Simpan anggaran</button>`);totAr()}
function tambahAr(){const k=$('#an').value.trim(),v=num('#anv');if(!k)return toast('Isi nama kategori',1);if(k.toLowerCase()==='aset')return toast('Nama itu dipakai untuk aset',1);if(!(v>0))return toast('Isi batas lebih dari 0',1);
if([...document.querySelectorAll('.ar')].some(e=>e.dataset.k.toLowerCase()===k.toLowerCase()))return toast('Anggaran itu sudah ada',1);
$('#al').insertAdjacentHTML('beforeend',arow(k,v));$('#an').value='';$('#anv').value='';totAr()}
function simpanAnggaran(){const a=[];document.querySelectorAll('.ar').forEach(e=>{const v=parseInt((e.querySelector('.ab').value||'').replace(/\D/g,''),10);if(v>0)a.push({label:e.dataset.k,nominal:v,extra:{bln:BL}})});
const tot=a.reduce((s,x)=>s+x.nominal,0),bt=batas(BL);if(tot>bt.v)return toast('Total anggaran '+rp(tot)+' melebihi batas '+rp(bt.v),1);
const nw=a.filter(x=>!KEL.some(k=>k.toLowerCase()===x.label.toLowerCase()));
kirim(async()=>{const d=await SB.from('records').delete().eq('kind','budget').eq('extra->>bln',BL);if(d.error)return d;
const rows=a.map(x=>mk('budget',x)).concat(nw.map(x=>mk('kategori',{label:x.label,extra:{j:'keluar'}})));return rows.length?SB.from('records').insert(rows):{}},'#sa','Anggaran tersimpan')}
function rancangan(){const[y0,m0]=curKey().split('-').map(Number);let h='';
for(let i=0;i<6;i++){const d=new Date(y0,m0-1+i,1),k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),Bk=gb(k),tot=Object.values(Bk).reduce((s,v)=>s+v,0),bt=batas(k),p=bt.v?tot/bt.v*100:0;
h+=`<div class="it gl" onclick="openBudget('${k}')"><div class="t"><b>${nmBln(k)}</b><small>${BB[k]?'Anggaran sendiri':tot?'Mengikuti anggaran default':'Belum disusun'} · batas ${rp(bt.v)}${bt.est&&bt.v?' (perkiraan)':''}</small><div class="bar" style="margin:6px 0 0"><i style="width:${Math.min(100,p)}%;background:${p>100?'#e5484d':p>=80?'#f59e0b':'#0fa97a'}"></i></div></div><div class="n">${rp(tot)}</div></div>`}
return`<h2>Rancangan anggaran</h2>${h}<small style="color:var(--mu);margin:0 4px">Ketuk satu bulan untuk menyusun atau mengubah anggarannya.</small>`}
/* ---------- Saldo & transfer ---------- */
function saldoAkun(){const s={};AKUN.forEach(a=>s[a]=SA[a]||0);Object.keys(SA).forEach(a=>s[a]=SA[a]);
D.forEach(x=>{if(x.akun)s[x.akun]=(s[x.akun]||0)+(x.jenis==='masuk'?x.nominal:-x.nominal)});
TF.forEach(t=>{s[t.dari]=(s[t.dari]||0)-t.nominal;s[t.ke]=(s[t.ke]||0)+t.nominal});
HU.forEach(h=>{if(h.akun)s[h.akun]=(s[h.akun]||0)+h.nominal});PI.forEach(h=>{if(h.akun)s[h.akun]=(s[h.akun]||0)-h.nominal});return s}
function evAkun(a){const e=[];
D.forEach(x=>{if(x.akun===a)e.push({t:x.tanggal,n:x.jenis==='masuk'?x.nominal:-x.nominal,l:x.catatan||x.kategori||'Transaksi',s:x.kategori||''})});
TF.forEach(t=>{if(t.dari===a)e.push({t:t.tanggal,n:-t.nominal,l:'Transfer ke '+t.ke,s:t.catatan});if(t.ke===a)e.push({t:t.tanggal,n:t.nominal,l:'Transfer dari '+t.dari,s:t.catatan})});
HU.forEach(h=>{if(h.akun===a)e.push({t:h.tanggal,n:h.nominal,l:(h.nominal>0?'Hutang dari ':'Bayar hutang ke ')+h.pihak,s:h.catatan})});PI.forEach(h=>{if(h.akun===a)e.push({t:h.tanggal,n:-h.nominal,l:(h.nominal>0?'Piutang ke ':'Terima dari ')+h.pihak,s:h.catatan})});
e.sort((p,q)=>p.t.localeCompare(q.t));let r=SA[a]||0;e.forEach(x=>{r+=x.n;x.b=r});return e}
function line(v){if(v.length<2)return'';const W=300,H=90,mn=Math.min(...v),sp=(Math.max(...v)-mn)||1;
return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:90px"><polyline fill="none" stroke="#6a5cf0" stroke-width="2.5" stroke-linejoin="round" points="${v.map((y,i)=>(i/(v.length-1)*W).toFixed(1)+','+(H-6-(y-mn)/sp*(H-12)).toFixed(1)).join(' ')}"/></svg>`}
function saldo(){const s=saldoAkun(),act=k=>s[k]!==0||D.some(x=>x.akun===k)||TF.some(t=>t.dari===k||t.ke===k)||HU.some(h=>h.akun===k)||PI.some(h=>h.akun===k);
KSA=Object.keys(s).filter(act).sort((a,b)=>s[b]-s[a]);const tot=KSA.reduce((p,k)=>p+s[k],0),mx=Math.max(...KSA.map(k=>Math.abs(s[k])),1);
return`<h2 style="margin-top:4px">Saldo akun</h2><div class="hero"><small>Total saldo semua akun</small><b>${rp(tot)}</b></div>
<div class="row"><button class="btn s" onclick="openTf()">⇄ Transfer</button><button class="btn s" onclick="openSA()">⚙️ Saldo awal</button></div>
<h2>Sisa saldo per akun</h2>${KSA.length?`<div class="gl" style="padding:16px">${KSA.map((k,i)=>`<div class="bar" style="cursor:pointer" onclick="openAkun(${i})"><div><span>${esc(k)}</span><b class="${s[k]<0?'out':''}">${rp(s[k])}</b></div><i style="width:${Math.abs(s[k])/mx*100}%;${s[k]<0?'background:#e5484d':''}"></i></div>`).join('')}<small style="color:var(--mu)">Ketuk akun untuk melihat grafik dan riwayatnya</small></div>`:emp('Belum ada saldo. Atur saldo awal atau catat transaksi.')}
<h2>Riwayat transfer</h2>${TF.length?urut(TF).slice(0,15).map(t=>`<div class="it gl" style="cursor:default"><div class="t"><b>${esc(t.dari)} → ${esc(t.ke)}</b><small>${esc([tgl(t.tanggal),t.catatan].filter(Boolean).join(' · '))}</small></div><div class="n">${rp(t.nominal)}</div><button class="xb" onclick="hapus(${t.row},this)">🗑</button></div>`).join(''):emp('Belum ada transfer.')}`}
function openAkun(i){const a=KSA[i],e=evAkun(a),cur=saldoAkun()[a]||0,m=new Map();e.forEach(x=>m.set(x.t,x.b));const v=[...m.values()].slice(-30);
shw(ttl(esc(a))+`<div class="hero" style="margin:0"><small>Saldo saat ini</small><b>${rp(cur)}</b></div>`+(v.length>1?`<div class="gl" style="padding:12px"><small style="color:var(--mu)">Tren saldo (${v.length} hari transaksi terakhir)</small>${line(v)}<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--mu)"><span>Terendah ${rp(Math.min(...v))}</span><span>Tertinggi ${rp(Math.max(...v))}</span></div></div>`:'')+`<b>Riwayat</b>`+(e.length?e.slice().reverse().slice(0,150).map(x=>`<div class="it gl" style="cursor:default"><div class="t"><b>${esc(x.l)}</b><small>${esc([tgl(x.t),x.s].filter(Boolean).join(' · '))}</small></div><div style="text-align:right"><div class="n ${x.n<0?'out':'in'}">${x.n<0?'-':'+'}${rp(Math.abs(x.n))}</div><small style="display:block">Saldo ${rp(x.b)}</small></div></div>`).join(''):emp('Belum ada riwayat.'))+`<button class="btn" onclick="closeSheet()">Tutup</button>`)}
function openTf(){shw(ttl('Transfer antar akun')+fld('Dari akun *',sel('tfd',AKUN,'Pilih akun asal'))+fld('Ke *',`<select id="tfk" onchange="$('#tfa').hidden=this.value!=='__ASET__'"><option value="">Pilih tujuan</option>${opts(AKUN,'')}<option value="__ASET__">💼 Aset (pilih jenis)</option></select>`)+`<div id="tfa" hidden>${fld('Jenis aset *',sel('tfj',ASET,'Pilih aset'))}</div><input id="tfn" class="big" inputmode="numeric" placeholder="Rp 0" oninput="fmt(this)"><div class="row">${fld('Tanggal *',`<input id="tft" type="date" value="${iso(new Date())}">`)}${fld('Catatan (opsional)','<input id="tfc" maxlength="120">')}</div><button class="btn" id="tfs" onclick="simpanTf()">Simpan transfer</button>`)}
function simpanTf(){const d=$('#tfd').value,k=$('#tfk').value,n=num('#tfn'),t=$('#tft').value,c=$('#tfc').value.trim(),j=$('#tfj').value;
if(!d)return toast('Pilih akun asal',1);if(!k)return toast('Pilih tujuan',1);if(k==='__ASET__'&&!j)return toast('Pilih jenis aset dulu',1);
if(d===k)return toast('Akun asal dan tujuan sama',1);if(!(n>0))return toast('Isi nominal lebih dari 0',1);if(!t)return toast('Pilih tanggal',1);
k==='__ASET__'?kirim(()=>tulis('aset',{tanggal:t,label:j,nominal:n,akun:d,catatan:c,extra:{s:1}}),'#tfs','Dikirim ke aset'):kirim(()=>tulis('transfer',{tanggal:t,akun:d,label:k,nominal:n,catatan:c}),'#tfs','Transfer tersimpan')}

return{now,d,lab:'Periode '+BLN[m-1]+' '+y,txt:(d>=0?'▲ ':'▼ ')+rp(Math.abs(d))+(prev?' ('+(d>=0?'+':'−')+Math.abs(Math.round(d/prev*100))+'%)':'')}}
const bulanSel=()=>{const[y0,m0]=curKey().split('-').map(Number);let o='';for(let i=1;i>=-12;i--){const d=new Date(y0,m0-1+i,1),k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');o+=`<option value="${k}"${pm===k?' selected':''}>${BLN[d.getMonth()]} ${d.getFullYear()}</option>`}return`<select onchange="pm=this.value;pw=defWeek(pm);render()" style="margin-bottom:10px">${o}</select>`};

${asOpen?`<div class="gl" style="padding:16px">${KAS.map((k,i)=>`<div class="bar" style="cursor:pointer" onclick="openAsD(${i})"><div><span>${esc(k)}</span><b class="${so[k]<0?'out':''}">${rp(so[k])}</b></div><i class="g" style="width:${Math.abs(so[k])/mx*100}%"></i></div>`).join('')}<small style="color:var(--mu)">Ketuk aset untuk melihat riwayatnya</small></div>`:''}
<div class="row" style="margin-top:12px"><button class="btn s" onclick="openAset('tambah')">+ Tambah aset</button><button class="btn s" onclick="openAset('kurang')">− Kurangi aset</button></div><button class="btn s" style="margin-top:8px" onclick="openSisa()">📅 Kirim sisa bulan ke aset</button>
<h2>Grafik aset</h2>${asetGrafik()}`}

r=(i,a,b,f)=>`<div class="it gl" onclick="${f}"><div class="ic" style="background:var(--sg)">${i}</div><div class="t"><b>${a}</b><small>${b}</small></div><span style="color:var(--mu)">›</span></div>`;

if(R.some(x=>!x.n))return toast('Nama tidak boleh kosong',1);const lw=R.map(x=>x.n.toLowerCase());if(new Set(lw).size!==lw.length)return toast('Ada nama yang kembar',1);
const keep=new Set(R.map(x=>x.id).filter(Boolean)),del=NM[j].filter(x=>!keep.has(String(x.id)));
kirim(async()=>{const T=SB.from.bind(SB);
for(const x of del){const r=await T('records').delete().eq('id',x.id);if(r.error)return r}
for(const x of R.filter(x=>x.id&&x.n!==x.l)){let r=await T('records').update({label:x.n}).eq('id',x.id);if(r.error)return r;
if(j==='akun'){r=await T('records').update({akun:x.n}).eq('akun',x.l);if(r.error)return r;r=await T('records').update({label:x.n}).eq('kind','transfer').eq('label',x.l)}
else if(j==='aset'){r=await T('records').update({label:x.n}).eq('kind','aset').eq('label',x.l)}
else{r=await T('records').update({label:x.n}).eq('kind','transaksi').eq('label',x.l).eq('extra->>jenis',j);if(r.error)return r;r=await T('records').update({label:x.n}).eq('kind','budget').eq('label',x.l)}
if(r.error)return r}
const ne=R.filter(x=>!x.id);return ne.length?T('records').insert(ne.map(x=>mk(j==='akun'?'akun':j==='aset'?'jenis_aset':'kategori',{label:x.n,extra:j==='akun'||j==='aset'?{}:{j}}))):{}},'#kls','Tersimpan')}

/* ---------- v1.1: Foto bukti ---------- */
async function kecilkan(f){const M=1280;let bm;
try{bm=await createImageBitmap(f,{imageOrientation:'from-image'})}catch(e){bm=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(f)})}
const w=bm.width||bm.naturalWidth,h=bm.height||bm.naturalHeight,k=Math.min(1,M/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
return new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error('gagal')),'image/jpeg',.72))}
function ambilFoto(id){pk=1;$('#'+id).click()}
async function pilihFoto(i){pk=0;const f=i.files&&i.files[0];i.value='';if(!f)return;if(!/^image\//.test(f.type))return toast('Pilih file gambar',1);
try{toast('Memproses foto…');const b=await kecilkan(f);if(FT.prev)URL.revokeObjectURL(FT.prev);FT.blob=b;FT.prev=URL.createObjectURL(b);FT.hapus=false;fotoUI();toast('Foto siap · '+Math.round(b.size/1024)+' KB')}catch(e){toast('Foto gagal diproses',1)}}
function hapusFoto(){if(FT.prev)URL.revokeObjectURL(FT.prev);FT.blob=null;FT.prev='';FT.hapus=true;fotoUI()}
function fotoUI(){const e=$('#fb');if(!e)return;const src=FT.hapus?'':(FT.prev||FT.url),mem=!FT.hapus&&FT.path&&!src;
e.innerHTML=(src?`<div class="pv"><img src="${src}" alt="Foto bukti" onclick="window.open(this.src)"></div>`:'')+(mem?'<small style="color:var(--mu)">Memuat foto…</small>':'')
+`<div class="row" style="margin-top:8px"><button type="button" class="btn s" onclick="ambilFoto('fk')">📷 Kamera</button><button type="button" class="btn s" onclick="ambilFoto('fg')">🖼 Galeri</button>${src||mem?'<button type="button" class="btn s d" onclick="hapusFoto()">🗑 Hapus</button>':''}</div>`}
async function muatFoto(){const pt=FT.path,e=ed;if(!pt)return;const{data}=await SB.storage.from('bukti').createSignedUrl(pt,300);if(data&&FT.path===pt&&ed===e){FT.url=data.signedUrl;fotoUI()}}
/* ---------- v1.1: Kunci sidik jari (per perangkat) ---------- */
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),ub64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const bioInfo=()=>{try{const o=JSON.parse(localStorage.getItem('bio')||'null');return o&&o.u===U?o:null}catch(e){return null}};
const bioOk=()=>!!(window.PublicKeyCredential&&window.isSecureContext&&navigator.credentials);
function kunci(){LK=true;closeSheet();$('#nav').style.display='none';const b=bioInfo(),p=!!(pinLok()&&ls('pinlock')===U);
$('#v').innerHTML=`<div class="gl ins" style="margin-top:14vh;padding:24px;text-align:center"><div style="font-size:44px">🔒</div><b style="font-size:20px">Catatan Keuangan</b><span style="color:var(--mu)">${b&&p?'Buka dengan sidik jari atau PIN 6 angka.':b?'Verifikasi sidik jari untuk membuka.':'Masukkan PIN 6 angka.'}</span>${p?'<input id="lp" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••" style="text-align:center;font-size:24px;letter-spacing:8px" oninput="cekPin(this)">':''}${b?'<button class="btn" onclick="buka()">Buka dengan sidik jari</button>':''}<button class="btn d" style="color:var(--tx);border-color:var(--bd)" onclick="try{localStorage.removeItem(\'bio\');localStorage.removeItem(\'pinlock\')}catch(e){};SB.auth.signOut()">Pakai kata sandi</button></div>`;if(b)buka();else if(p)$('#lp').focus()}
async function buka(){const o=bioInfo();if(!o)return mulai();
try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:ub64(o.id),transports:['internal']}],userVerification:'required',timeout:60000}});mulai()}catch(e){toast('Verifikasi dibatalkan atau gagal',1)}}
async function bioAktif(){if(!bioOk())return toast('Browser/perangkat ini belum mendukung sidik jari',1);
if(bioInfo()){if(!confirm('Matikan kunci sidik jari di perangkat ini?'))return;try{localStorage.removeItem('bio')}catch(e){}toast('Sidik jari dimatikan');return render()}
try{if(!(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()))return toast('Belum ada sidik jari atau kunci layar di perangkat ini',1);
const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Catatan Keuangan'},user:{id:new TextEncoder().encode(U),name:'pengguna',displayName:'Catatan Keuangan'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000}});
localStorage.setItem('bio',JSON.stringify({u:U,id:b64(c.rawId)}));toast('Sidik jari aktif di perangkat ini');render()}catch(e){toast('Aktivasi dibatalkan atau gagal',1)}}

/* ---------- v1.6: PIN, edit hutang/piutang, grafik hutang ---------- */
const ls=k=>{try{return localStorage.getItem(k)}catch(e){return null}},
sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(x=>x.toString(16).padStart(2,'0')).join(''),
pinLok=()=>{try{const o=JSON.parse(ls('pinc')||'null');return o&&o.u===U?o:null}catch(e){return null}},
lockOn=()=>!!(bioInfo()||(pinLok()&&ls('pinlock')===U));
let pf=0,pb=0;
async function cekPin(i){const v=i.value.replace(/\D/g,'');i.value=v;if(v.length<6)return;if(Date.now()<pb){i.value='';return toast('Terlalu banyak salah. Tunggu sebentar.',1)}
const o=pinLok();if(o&&await sha(o.salt+v)===o.h){pf=0;mulai()}else{i.value='';if(++pf>=5){pf=0;pb=Date.now()+30000;toast('5 kali salah. Coba lagi 30 detik.',1)}else toast('PIN salah',1)}}
function mintaPin(cb,info){if(!PN){toast('Atur PIN 6 angka dulu di Pengaturan > Keamanan',1);return openAman()}
const d=document.createElement('div');d.id='pinm';d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:15;display:grid;place-items:center;padding:20px';
d.innerHTML=`<div class="gl ins" style="background:var(--pn);width:100%;max-width:340px;padding:22px;text-align:center"><b style="font-size:18px">Masukkan PIN</b><span style="color:var(--mu)">${esc(info||'Konfirmasi dengan PIN 6 angka.')}</span><input id="pq" type="password" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="off" style="text-align:center;font-size:24px;letter-spacing:8px"><button class="btn d" style="color:var(--tx);border-color:var(--bd)" id="pbt">Batal</button></div>`;
document.body.appendChild(d);const q=$('#pq');q.focus();$('#pbt').onclick=()=>d.remove();
q.oninput=async()=>{const v=q.value.replace(/\D/g,'');q.value=v;if(v.length<6)return;if(await sha(PN.salt+v)===PN.h){d.remove();cb()}else{q.value='';toast('PIN salah',1)}}}
function openAman(){const b=bioInfo(),p=!!PN,lk=ls('pinlock')===U;
shw(ttl('Keamanan')+`<small style="color:var(--mu)">PIN 6 angka dipakai untuk membuka aplikasi (bila kunci PIN aktif di perangkat ini) dan wajib saat mengurangi aset.</small><button class="btn" onclick="bioAktif()">${b?'Matikan sidik jari':'Aktifkan sidik jari'}</button><button class="btn" onclick="aturPin()">${p?'Ubah PIN':'Atur PIN 6 angka'}</button>${p?`<button class="btn d" style="color:var(--tx);border-color:var(--bd)" onclick="kunciPin()">${lk?'Matikan kunci PIN di perangkat ini':'Aktifkan kunci PIN di perangkat ini'}</button>`:''}<button class="btn d" style="color:var(--tx);border-color:var(--bd)" onclick="closeSheet()">Tutup</button>`)}
function kunciPin(){try{if(ls('pinlock')===U)localStorage.removeItem('pinlock');else localStorage.setItem('pinlock',U)}catch(e){}openAman()}
const pi6=id=>`<input id="${id}" type="password" inputmode="numeric" maxlength="6" autocomplete="off">`;
function aturPin(){shw(ttl(PN?'Ubah PIN':'Atur PIN')+(PN?fld('PIN lama',pi6('po')):'')+fld('PIN baru (6 angka)',pi6('pn1'))+fld('Ulangi PIN baru',pi6('pn2'))+`<button class="btn" id="pns" onclick="simpanPin()">Simpan PIN</button>`)}
async function simpanPin(){const a=$('#pn1').value,c=$('#pn2').value;
if(PN&&await sha(PN.salt+($('#po').value||''))!==PN.h)return toast('PIN lama salah',1);
if(!/^\d{6}$/.test(a))return toast('PIN harus 6 angka',1);if(a!==c)return toast('Ulangan PIN tidak sama',1);
const salt=[...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16).padStart(2,'0')).join(''),h=await sha(salt+a);
kirim(()=>{try{localStorage.setItem('pinc',JSON.stringify({u:U,salt,h}));localStorage.setItem('pinlock',U)}catch(e){}return PN?SB.from('records').update({extra:{salt,h}}).eq('id',PN.id):tulis('pin',{label:'pin',extra:{salt,h}})},'#pns','PIN tersimpan')}
function editHP(kind,row){const A=kind==='hutang'?HU:PI,x=A.find(a=>a.row===row);if(!x)return;const sg=x.nominal>0?1:-1;
shw(ttl('Ubah entri '+kind)+fld(kind==='hutang'?'Pihak *':'Customer *',`<input id="ehp" maxlength="60" value="${esc(x.pihak)}">`)+fld('Akun (opsional)',`<select id="eha"><option value="">— Tanpa akun —</option>${opts(AKUN,x.akun)}</select>`)+`<input id="ehn" class="big" inputmode="numeric" value="${rp(Math.abs(x.nominal))}" oninput="fmt(this)"><div class="row">${fld('Tanggal *',`<input id="eht" type="date" value="${x.tanggal}">`)}${fld('Catatan (opsional)',`<input id="ehc" maxlength="120" value="${esc(x.catatan)}">`)}</div><button class="btn" id="ehv" onclick="simpanEHP('${kind}',${row},${sg})">Simpan perubahan</button>`)}
function simpanEHP(kind,row,sg){const A=kind==='hutang'?HU:PI,o=A.find(a=>a.row===row),p=$('#ehp').value.trim(),a=$('#eha').value,n=num('#ehn'),t=$('#eht').value,c=$('#ehc').value.trim();
if(!p)return toast('Nama wajib diisi',1);if(!(n>0))return toast('Isi nominal lebih dari 0',1);if(!t)return toast('Pilih tanggal',1);
const sm=q=>A.filter(x=>x.pihak===q&&x.row!==row).reduce((s,x)=>s+x.nominal,0);
if(sm(p)+sg*n<0)return toast('Hasilnya membuat sisa '+kind+' '+p+' minus',1);
if(o&&o.pihak!==p&&sm(o.pihak)<0)return toast('Sisa '+kind+' '+o.pihak+' akan minus',1);
kirim(()=>SB.from('records').update({tanggal:t,label:p,nominal:n,akun:a,catatan:c,extra:{s:sg}}).eq('id',row),'#ehv','Entri diperbarui')}
function hutangGrafik(){if(!HU.length)return emp('Belum ada data hutang.');
const m=new Map();let r=0;HU.slice().sort((a,b)=>a.tanggal.localeCompare(b.tanggal)||a.row-b.row).forEach(x=>{r+=x.nominal;m.set(x.tanggal,r)});
const v=[...m.values()].slice(-30),baru=HU.filter(x=>x.nominal>0).reduce((s,x)=>s+x.nominal,0),byr=-HU.filter(x=>x.nominal<0).reduce((s,x)=>s+x.nominal,0),mx=Math.max(baru,byr,1);
return`<div class="gl" style="padding:16px">${v.length>1?`<small style="color:var(--mu)">Tren total hutang (${v.length} tanggal terakhir)</small>${line(v)}<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--mu)"><span>Terendah ${rp(Math.min(...v))}</span><span>Tertinggi ${rp(Math.max(...v))}</span></div>`:'<small style="color:var(--mu)">Grafik tren muncul setelah ada minimal dua tanggal transaksi.</small>'}<div style="margin-top:14px"><div class="bar"><div><span>Hutang baru</span><b class="out">${rp(baru)}</b></div><i style="width:${baru/mx*100}%;background:#e5484d"></i></div><div class="bar"><div><span>Sudah dibayar</span><b class="in">${rp(byr)}</b></div><i class="g" style="width:${byr/mx*100}%"></i></div></div><small style="color:var(--mu)">Ketuk nama di atas untuk melihat dan mengubah riwayat.</small></div>`}
