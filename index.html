let D=[],TF=[],AS=[],HU=[],SA={},B={},U=null,tab='home',per='bulan',pm=curKey(),pw=0,pd='',cf='',ct='',q='',kf='',ed=null,jn='keluar',busy=false,dt=0,asTab='aset',asOpen=true,KSA=[],KAS=[],KHU=[];

if(per==='bulan'||per==='minggu'){const[y0,m0]=curKey().split('-').map(Number);let o='';for(let i=1;i>=-12;i--){const d=new Date(y0,m0-1+i,1),k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');o+=`<option value="${k}"${pm===k?' selected':''}>${BLN[d.getMonth()]} ${d.getFullYear()}</option>`}

function home(){const r=range(),L=D.filter(x=>inR(x,r.a,r.b)),m=sum(L,'masuk'),k=sum(L,'keluar'),P=sum(D.filter(x=>inR(x,r.pa,r.pb)),'keluar'),top=byCat(L)[0];let ins='';

function anggaranHtml(){const[a,b]=perBulan(pm),A=iso(a),E=iso(b),sp={},[y,m]=pm.split('-').map(Number);
D.filter(x=>x.jenis==='keluar'&&inR(x,A,E)).forEach(x=>{const k=x.kategori||'Tanpa kategori';sp[k]=(sp[k]||0)+x.nominal});
const ks=Object.keys(B).filter(k=>B[k]>0).sort((p,q)=>B[q]-B[p]),btn='<button class="btn s" style="margin-top:10px" onclick="openBudget()">⚙️ Atur anggaran</button>',h=`<h2>Anggaran ${BLN[m-1]} ${y}</h2>`;
if(!ks.length)return h+emp('Belum ada anggaran. Atur batas pengeluaran per kategori.')+btn;
const tb=ks.reduce((s,k)=>s+B[k],0),ts=ks.reduce((s,k)=>s+(sp[k]||0),0),oth=Object.keys(sp).filter(k=>!(B[k]>0)).reduce((s,k)=>s+sp[k],0),

const dd={};L.filter(x=>x.jenis==='keluar').forEach(x=>dd[x.tanggal]=(dd[x.tanggal]||0)+x.nominal);const ds=Object.keys(dd).sort().slice(-31),dm=Math.max(...ds.map(d=>dd[d]),1);

const mk=(kind,x)=>({kind,tanggal:iso(new Date()),nominal:0,...x});
async function kirim(fn,btn,msg){if(busy)return;busy=true;const e=$(btn),lb=e.textContent;e.disabled=true;e.textContent='Menyimpan…';
try{const r=await fn();if(r&&r.error)throw r.error}catch(x){busy=false;e.disabled=false;e.textContent=lb;return toast(x.message||'Gagal menyimpan',1)}
busy=false;closeSheet();toast(msg);load()}
const tulis=(kind,x)=>SB.from('records').insert(mk(kind,x));
async function ganti(kind,arr){const d=await SB.from('records').delete().eq('kind',kind);if(d.error)return d;return arr.length?SB.from('records').insert(arr.map(x=>mk(kind,x))):{}}
let dtm=0;async function hapus(row,b){if(!b.dataset.s){b.dataset.s=1;b.textContent='Tap lagi';setTimeout(()=>{delete b.dataset.s;b.textContent='🗑'},3000);return}
if(busy)return;busy=true;const{error}=await SB.from('records').delete().eq('id',row);busy=false;if(error)return toast(error.message,1);closeSheet();toast('Entri dihapus');load()}
/* ---------- Form transaksi ---------- */
const cats=()=>[...new Set([...(jn==='keluar'?KEL:MAS),...D.filter(x=>x.jenis===jn&&x.kategori).map(x=>x.kategori)])].filter(k=>k.toLowerCase()!=='aset');
function openSheet(i){const o=i===undefined?null:D[i];if(o&&o.v)return toast('Entri aset: ubah atau hapus lewat menu Aset',1);ed=o?i:null;jn=o?o.jenis:'keluar';drawSheet(o);$('#bg').style.display='block';requestAnimationFrame(()=>$('#sh').classList.add('on'))}
function closeSheet(){$('#sh').classList.remove('on');$('#bg').style.display='none'}
function drawSheet(o){const v=o||{nominal:'',kategori:'',akun:'',catatan:'',tanggal:iso(new Date())},lk=ed!==null?'disabled':'';
$('#sh').innerHTML=`<div class="seg"><button class="k${jn==='keluar'?' on':''}" ${lk} onclick="jn='keluar';drawSheet(snap())">Pengeluaran</button><button class="m${jn==='masuk'?' on':''}" ${lk} onclick="jn='masuk';drawSheet(snap())">Pemasukan</button></div>
<input id="nom" class="big" inputmode="numeric" placeholder="Rp 0" value="${v.nominal?rp(v.nominal):''}" oninput="fmt(this)">
<div class="row"><div><label>Kategori *</label><select id="kat" onchange="cw()"><option value="">Pilih</option>${opts(cats(),v.kategori)}</select></div><div><label>Akun *</label><select id="akn"><option value="">Pilih</option>${opts(AKUN,v.akun)}</select></div></div>
<div class="row"><div><label>Tanggal *</label><input id="tgl" type="date" value="${v.tanggal}"></div><div><label id="cl">Catatan (opsional)</label><input id="cat" maxlength="120" value="${esc(v.catatan)}"></div></div>
<button class="btn" id="sv" onclick="save()">${ed===null?'Simpan transaksi':'Simpan perubahan'}</button>${ed!==null?'<button class="btn d" id="dl" onclick="del()">Hapus transaksi</button>':''}`;cw();if(ed===null)setTimeout(()=>$('#nom').focus(),300)}
function cw(){const w=$('#kat').value.trim().toLowerCase()==='lainnya';$('#cl').textContent=w?'Catatan (wajib)':'Catatan (opsional)'}
const snap=()=>({nominal:parseInt(($('#nom').value||'').replace(/\D/g,''))||'',kategori:'',akun:$('#akn').value,catatan:$('#cat').value,tanggal:$('#tgl').value});
function fmt(e){const n=parseInt(e.value.replace(/\D/g,''));e.value=n?rp(n):''}
async function save(){if(busy)return;const n=num('#nom'),kat=$('#kat').value,cat=$('#cat').value.trim();
if(!(n>0))return toast('Isi nominal lebih dari 0',1);if(!kat)return toast('Pilih kategori',1);if(!$('#akn').value)return toast('Pilih akun',1);if(!$('#tgl').value)return toast('Pilih tanggal',1);
if(kat.toLowerCase()==='lainnya'&&!cat){$('#cat').focus();return toast('Catatan wajib diisi jika kategori Lainnya',1)}
const rec=mk('transaksi',{tanggal:$('#tgl').value,nominal:n,akun:$('#akn').value,label:kat,catatan:cat,extra:{jenis:jn}});
kirim(()=>ed===null?SB.from('records').insert(rec):SB.from('records').update(rec).eq('id',D[ed].id),'#sv','Transaksi tersimpan')}
function del(){const b=$('#dl');if(!b.dataset.s){b.dataset.s=1;b.textContent='Tap lagi untuk menghapus permanen';dtm=setTimeout(()=>{delete b.dataset.s;b.textContent='Hapus transaksi'},4000);return}
clearTimeout(dtm);kirim(()=>SB.from('records').delete().eq('id',D[ed].id),'#dl','Transaksi dihapus')}
/* ---------- Anggaran ---------- */
function openBudget(){const ks=[...new Set([...KEL,...D.filter(x=>x.jenis==='keluar'&&x.kategori).map(x=>x.kategori)])].filter(k=>k!=='Aset');
shw(ttl('Anggaran per bulan')+`<small style="color:var(--mu)">Batas pengeluaran tiap kategori, berlaku untuk setiap periode bulan. Kosongkan jika tanpa anggaran.</small>${ks.map(k=>`<div class="row" style="align-items:center"><label style="flex:1.2;margin:0;color:var(--tx)">${esc(k)}</label><input class="ab" data-k="${esc(k)}" inputmode="numeric" placeholder="Rp 0" value="${B[k]?rp(B[k]):''}" oninput="fmt(this)"></div>`).join('')}<button class="btn" id="sa" onclick="simpanAnggaran()">Simpan anggaran</button>`)}
function simpanAnggaran(){const a=[];document.querySelectorAll('.ab').forEach(i=>{const v=parseInt((i.value||'').replace(/\D/g,''),10);if(v>0)a.push({label:i.getAttribute('data-k'),nominal:v})});
kirim(()=>ganti('budget',a),'#sa','Anggaran tersimpan')}
/* ---------- Saldo & transfer ---------- */
function saldoAkun(){const s={};AKUN.forEach(a=>s[a]=SA[a]||0);Object.keys(SA).forEach(a=>s[a]=SA[a]);
D.forEach(x=>{if(x.akun)s[x.akun]=(s[x.akun]||0)+(x.jenis==='masuk'?x.nominal:-x.nominal)});
TF.forEach(t=>{s[t.dari]=(s[t.dari]||0)-t.nominal;s[t.ke]=(s[t.ke]||0)+t.nominal});
HU.forEach(h=>{if(h.akun)s[h.akun]=(s[h.akun]||0)+h.nominal});return s}
function evAkun(a){const e=[];
D.forEach(x=>{if(x.akun===a)e.push({t:x.tanggal,n:x.jenis==='masuk'?x.nominal:-x.nominal,l:x.catatan||x.kategori||'Transaksi',s:x.kategori||''})});
TF.forEach(t=>{if(t.dari===a)e.push({t:t.tanggal,n:-t.nominal,l:'Transfer ke '+t.ke,s:t.catatan});if(t.ke===a)e.push({t:t.tanggal,n:t.nominal,l:'Transfer dari '+t.dari,s:t.catatan})});
HU.forEach(h=>{if(h.akun===a)e.push({t:h.tanggal,n:h.nominal,l:(h.nominal>0?'Hutang dari ':'Bayar hutang ke ')+h.pihak,s:h.catatan})});
e.sort((p,q)=>p.t.localeCompare(q.t));let r=SA[a]||0;e.forEach(x=>{r+=x.n;x.b=r});return e}
function line(v){if(v.length<2)return'';const W=300,H=90,mn=Math.min(...v),sp=(Math.max(...v)-mn)||1;
return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:90px"><polyline fill="none" stroke="#6a5cf0" stroke-width="2.5" stroke-linejoin="round" points="${v.map((y,i)=>(i/(v.length-1)*W).toFixed(1)+','+(H-6-(y-mn)/sp*(H-12)).toFixed(1)).join(' ')}"/></svg>`}
function saldo(){const s=saldoAkun(),act=k=>s[k]!==0||D.some(x=>x.akun===k)||TF.some(t=>t.dari===k||t.ke===k)||HU.some(h=>h.akun===k);
KSA=Object.keys(s).filter(act).sort((a,b)=>s[b]-s[a]);const tot=KSA.reduce((p,k)=>p+s[k],0),mx=Math.max(...KSA.map(k=>Math.abs(s[k])),1);
return`<h2 style="margin-top:4px">Saldo akun</h2><div class="hero"><small>Total saldo semua akun</small><b>${rp(tot)}</b></div>
<div class="row"><button class="btn s" onclick="openTf()">⇄ Transfer</button><button class="btn s" onclick="openSA()">⚙️ Saldo awal</button></div>
<h2>Sisa saldo per akun</h2>${KSA.length?`<div class="gl" style="padding:16px">${KSA.map((k,i)=>`<div class="bar" style="cursor:pointer" onclick="openAkun(${i})"><div><span>${esc(k)}</span><b class="${s[k]<0?'out':''}">${rp(s[k])}</b></div><i style="width:${Math.abs(s[k])/mx*100}%;${s[k]<0?'background:#e5484d':''}"></i></div>`).join('')}<small style="color:var(--mu)">Ketuk akun untuk melihat grafik dan riwayatnya</small></div>`:emp('Belum ada saldo. Atur saldo awal atau catat transaksi.')}
<h2>Riwayat transfer</h2>${TF.length?urut(TF).slice(0,15).map(t=>`<div class="it gl" style="cursor:default"><div class="t"><b>${esc(t.dari)} → ${esc(t.ke)}</b><small>${esc([tgl(t.tanggal),t.catatan].filter(Boolean).join(' · '))}</small></div><div class="n">${rp(t.nominal)}</div><button class="xb" onclick="hapus(${t.row},this)">🗑</button></div>`).join(''):emp('Belum ada transfer.')}`}
function openAkun(i){const a=KSA[i],e=evAkun(a),cur=saldoAkun()[a]||0,m=new Map();e.forEach(x=>m.set(x.t,x.b));const v=[...m.values()].slice(-30);
shw(ttl(esc(a))+`<div class="hero" style="margin:0"><small>Saldo saat ini</small><b>${rp(cur)}</b></div>`+(v.length>1?`<div class="gl" style="padding:12px"><small style="color:var(--mu)">Tren saldo (${v.length} hari transaksi terakhir)</small>${line(v)}<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--mu)"><span>Terendah ${rp(Math.min(...v))}</span><span>Tertinggi ${rp(Math.max(...v))}</span></div></div>`:'')+`<b>Riwayat</b>`+(e.length?e.slice().reverse().slice(0,150).map(x=>`<div class="it gl" style="cursor:default"><div class="t"><b>${esc(x.l)}</b><small>${esc([tgl(x.t),x.s].filter(Boolean).join(' · '))}</small></div><div style="text-align:right"><div class="n ${x.n<0?'out':'in'}">${x.n<0?'-':'+'}${rp(Math.abs(x.n))}</div><small style="display:block">Saldo ${rp(x.b)}</small></div></div>`).join(''):emp('Belum ada riwayat.'))+`<button class="btn" onclick="closeSheet()">Tutup</button>`)}
function openTf(){shw(ttl('Transfer antar akun')+fld('Dari akun *',sel('tfd',AKUN,'Pilih akun asal'))+fld('Ke *',`<select id="tfk" onchange="$('#tfa').hidden=this.value!=='__ASET__'"><option value="">Pilih tujuan</option>${opts(AKUN,'')}<option value="__ASET__">💼 Aset (pilih jenis)</option></select>`)+`<div id="tfa" hidden>${fld('Jenis aset *',sel('tfj',ASET,'Pilih aset'))}</div><input id="tfn" class="big" inputmode="numeric" placeholder="Rp 0" oninput="fmt(this)"><div class="row">${fld('Tanggal *',`<input id="tft" type="date" value="${iso(new Date())}">`)}${fld('Catatan (opsional)','<input id="tfc" maxlength="120">')}</div><button class="btn" id="tfs" onclick="simpanTf()">Simpan transfer</button>`)}
function simpanTf(){const d=$('#tfd').value,k=$('#tfk').value,n=num('#tfn'),t=$('#tft').value,c=$('#tfc').value.trim(),j=$('#tfj').value;
if(!d)return toast('Pilih akun asal',1);if(!k)return toast('Pilih tujuan',1);if(k==='__ASET__'&&!j)return toast('Pilih jenis aset dulu',1);
if(d===k)return toast('Akun asal dan tujuan sama',1);if(!(n>0))return toast('Isi nominal lebih dari 0',1);if(!t)return toast('Pilih tanggal',1);
k==='__ASET__'?kirim(()=>tulis('aset',{tanggal:t,label:j,nominal:n,akun:d,catatan:c,extra:{s:1}}),'#tfs','Dikirim ke aset'):kirim(()=>tulis('transfer',{tanggal:t,akun:d,label:k,nominal:n,catatan:c}),'#tfs','Transfer tersimpan')}
function openSA(){shw(ttl('Saldo awal akun')+`<small style="color:var(--mu)">Saldo tiap akun sebelum transaksi di aplikasi ini dicatat. Kosongkan jika nol.</small>`+AKUN.map(a=>`<div class="row" style="align-items:center"><label style="flex:1.2;margin:0;color:var(--tx)">${esc(a)}</label><input class="sa" data-k="${esc(a)}" inputmode="numeric" placeholder="Rp 0" value="${SA[a]?rp(SA[a]):''}" oninput="fmt(this)"></div>`).join('')+`<button class="btn" id="sas" onclick="simpanSA()">Simpan saldo awal</button>`)}
function simpanSA(){const a=[];document.querySelectorAll('.sa').forEach(i=>{const v=parseInt((i.value||'').replace(/\D/g,''),10);if(v>0)a.push({akun:i.getAttribute('data-k'),nominal:v})});
kirim(()=>ganti('saldo_awal',a),'#sas','Saldo awal tersimpan')}
/* ---------- Aset & hutang ---------- */
function asetSaldo(){const o={};ASET.forEach(a=>o[a]=0);AS.forEach(x=>o[x.aset]=(o[x.aset]||0)+x.nominal);return o}
function hutangSaldo(){const o={};HU.forEach(h=>o[h.pihak]=(o[h.pihak]||0)+h.nominal);return o}
function rowL(x,lab,inv){const p=x.nominal>0,g=inv?!p:p,ak=x.akun?(inv?(p?'ke ':'dari '):(p?'dari ':'ke '))+x.akun:'';
return`<div class="it gl" style="cursor:default"><div class="ic ${g?'masuk':'keluar'}">${p?'+':'−'}</div><div class="t"><b>${esc(lab)}</b><small>${esc([tgl(x.tanggal),ak,x.catatan].filter(Boolean).join(' · '))}</small></div><div class="n ${g?'in':'out'}">${p?'+':'-'}${rp(Math.abs(x.nominal))}</div><button class="xb" onclick="hapus(${x.row},this)">🗑</button></div>`}
function asetPage(){const seg=`<div class="seg" style="margin-bottom:12px"><button class="${asTab==='aset'?'on':''}" onclick="asTab='aset';render()">Aset</button><button class="${asTab==='hutang'?'on':''}" onclick="asTab='hutang';render()">Hutang</button></div>`;
if(asTab==='hutang'){const hs=hutangSaldo();KHU=Object.keys(hs).filter(k=>hs[k]!==0).sort((a,b)=>hs[b]-hs[a]);const tot=KHU.reduce((p,k)=>p+hs[k],0),mx=Math.max(...KHU.map(k=>Math.abs(hs[k])),1);
return seg+`<div class="hero"><small>Total hutang</small><b>${rp(tot)}</b></div><div class="row"><button class="btn s" onclick="openHu('baru')">+ Hutang baru</button><button class="btn s" onclick="openHu('bayar')">💸 Bayar hutang</button></div>
<h2>Sisa hutang</h2>${KHU.length?`<div class="gl" style="padding:16px">${KHU.map((k,i)=>`<div class="bar" style="cursor:pointer" onclick="openHuD(${i})"><div><span>${esc(k)}</span><b class="out">${rp(hs[k])}</b></div><i style="width:${Math.abs(hs[k])/mx*100}%;background:#e5484d"></i></div>`).join('')}<small style="color:var(--mu)">Ketuk nama untuk melihat riwayat</small></div>`:emp('Tidak ada hutang.')}
<h2>Riwayat hutang</h2>${HU.length?urut(HU).slice(0,15).map(x=>rowL(x,x.pihak,1)).join(''):emp('Belum ada riwayat hutang.')}`}
const so=asetSaldo();KAS=Object.keys(so);const tot=KAS.reduce((p,k)=>p+so[k],0),th=Object.values(hutangSaldo()).reduce((p,v)=>p+v,0),mx=Math.max(...KAS.map(k=>Math.abs(so[k])),1);
return seg+`<div class="hero" style="cursor:pointer" onclick="asOpen=!asOpen;render()"><small>Total aset · ketuk untuk ${asOpen?'tutup':'lihat'} rincian</small><b>${rp(tot)}</b>${th?`<small>Setelah dikurangi hutang: ${rp(tot-th)}</small>`:''}</div>
${asOpen?`<div class="gl" style="padding:16px">${KAS.map((k,i)=>`<div class="bar" style="cursor:pointer" onclick="openAsD(${i})"><div><span>${esc(k)}</span><b class="${so[k]<0?'out':''}">${rp(so[k])}</b></div><i class="g" style="width:${Math.abs(so[k])/mx*100}%"></i></div>`).join('')}<small style="color:var(--mu)">Ketuk aset untuk melihat riwayatnya</small></div>`:''}
<div class="row" style="margin-top:12px"><button class="btn s" onclick="openAset('tambah')">+ Tambah aset</button><button class="btn s" onclick="openAset('kurang')">− Kurangi aset</button></div><button class="btn s" style="margin-top:8px" onclick="openSisa()">📅 Kirim sisa bulan ke aset</button>
<h2>Riwayat aset</h2>${AS.length?urut(AS).slice(0,15).map(x=>rowL(x,x.aset)).join(''):emp('Belum ada riwayat aset.')}`}
function openAsD(i){const a=KAS[i],L=urut(AS.filter(x=>x.aset===a));shw(ttl(esc(a))+`<div class="hero" style="margin:0"><small>Saldo aset</small><b>${rp(asetSaldo()[a]||0)}</b></div><b>Riwayat</b>`+(L.length?L.map(x=>rowL(x,x.aset)).join(''):emp('Belum ada riwayat.'))+`<button class="btn" onclick="closeSheet()">Tutup</button>`)}
function openHuD(i){const a=KHU[i],L=urut(HU.filter(x=>x.pihak===a));shw(ttl('Hutang · '+esc(a))+`<div class="hero" style="margin:0"><small>Sisa hutang</small><b>${rp(hutangSaldo()[a]||0)}</b></div><b>Riwayat</b>`+L.map(x=>rowL(x,x.pihak,1)).join('')+`<button class="btn" onclick="closeSheet()">Tutup</button>`)}
function openAset(mode,pre){pre=pre||{};const tb=mode==='tambah';
shw(ttl(tb?'Tambah aset':'Kurangi aset')+(pre.info?`<small style="color:var(--mu)">${pre.info}</small>`:'')+fld('Aset *',sel('asj',ASET,'Pilih aset'))+fld(pre.wa?'Akun sumber uang *':tb?'Akun sumber uang (opsional)':'Akun tujuan uang (opsional)',sel('asa',AKUN,pre.wa?'Pilih akun':'— Tanpa akun (penyesuaian) —'))+`<input id="asn" class="big" inputmode="numeric" placeholder="Rp 0" value="${pre.nominal?rp(pre.nominal):''}" oninput="fmt(this)"><div class="row">${fld('Tanggal *',`<input id="ast" type="date" value="${iso(new Date())}">`)}${fld('Catatan (opsional)',`<input id="asc" maxlength="120" value="${esc(pre.catatan||'')}">`)}</div><button class="btn" id="asv" onclick="simpanAset('${mode}',${pre.wa?1:0})">Simpan</button>`)}
function simpanAset(mode,wa){const j=$('#asj').value,a=$('#asa').value,n=num('#asn'),t=$('#ast').value,c=$('#asc').value.trim();
if(!j)return toast('Pilih aset dulu',1);if(wa&&!a)return toast('Pilih akun sumber uang',1);if(!(n>0))return toast('Isi nominal lebih dari 0',1);if(!t)return toast('Pilih tanggal',1);
if(mode==='kurang'&&n>(asetSaldo()[j]||0))return toast('Melebihi saldo aset '+j,1);
kirim(()=>tulis('aset',{tanggal:t,label:j,nominal:n,akun:a,catatan:c,extra:{s:mode==='tambah'?1:-1}}),'#asv','Aset tersimpan')}
function openSisa(){const[a,b]=perBulan(pm),[y,m]=pm.split('-').map(Number),L=D.filter(x=>inR(x,iso(a),iso(b))),left=sum(L,'masuk')-sum(L,'keluar');
if(left<=0)return toast('Belum ada sisa di periode '+BLN[m-1]+' '+y,1);
openAset('tambah',{nominal:left,wa:1,catatan:'Sisa '+BLN[m-1]+' '+y,info:`Sisa ${BLN[m-1]} ${y} (pemasukan − pengeluaran, ${tgl(iso(a))} – ${tgl(iso(b))}): <b>${rp(left)}</b>. Nominal bisa diubah.`})}
function openHu(mode){const by=mode==='bayar',hs=hutangSaldo(),ns=Object.keys(hs).filter(k=>by?hs[k]>0:true);
shw(ttl(by?'Bayar hutang':'Hutang baru')+fld('Pihak *',`<input id="hup" list="hul" placeholder="Nama pihak" autocomplete="off" maxlength="60"><datalist id="hul">${ns.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`)+fld(by?'Akun pembayaran (opsional)':'Akun penerima uang (opsional)',sel('hua',AKUN,'— Tanpa akun —'))+`<input id="hun" class="big" inputmode="numeric" placeholder="Rp 0" oninput="fmt(this)"><div class="row">${fld('Tanggal *',`<input id="hut" type="date" value="${iso(new Date())}">`)}${fld('Catatan (opsional)','<input id="huc" maxlength="120">')}</div><button class="btn" id="huv" onclick="simpanHu('${mode}')">Simpan</button>`)}
function simpanHu(mode){const p=$('#hup').value.trim(),a=$('#hua').value,n=num('#hun'),t=$('#hut').value,c=$('#huc').value.trim(),sisa=hutangSaldo()[p]||0;
if(!p)return toast('Isi nama pihak',1);if(!(n>0))return toast('Isi nominal lebih dari 0',1);if(!t)return toast('Pilih tanggal',1);
if(mode==='bayar'){if(!(sisa>0))return toast('Tidak ada hutang ke '+p,1);if(n>sisa)return toast('Melebihi sisa hutang ('+rp(sisa)+')',1)}
kirim(()=>tulis('hutang',{tanggal:t,label:p,nominal:n,akun:a,catatan:c,extra:{s:mode==='baru'?1:-1}}),'#huv','Hutang tersimpan')}
</script></body></html>
